```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoAI - AI Content Creator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #312e81);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 45px 20px 25px;
}

header h1 {
  font-size: 48px;
  margin: 0;
}

header p {
  color: #cbd5e1;
  font-size: 18px;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(30, 41, 59, 0.95);
  padding: 30px;
  border-radius: 20px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #64748b;
  background: #0f172a;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #8b5cf6;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #7c3aed;
}

.result {
  display: none;
  margin-top: 30px;
}

.box {
  background: #0f172a;
  padding: 20px;
  border-radius: 14px;
  margin-top: 15px;
  line-height: 1.7;
}

.box h3 {
  margin-top: 0;
}

footer {
  text-align: center;
  padding: 30px;
  color: #94a3b8;
}
</style>
</head>

<body>

<header>
  <h1>🎬 VideoAI</h1>
  <p>Turn your idea into an AI-ready video plan</p>
</header>

<div class="container">

  <div class="card">

    <label>💡 Video Topic</label>

    <textarea id="topic"
      placeholder="Example: 5 amazing facts about the universe"></textarea>

    <label>🎨 Video Style</label>

    <select id="style">
      <option>Educational</option>
      <option>Motivational</option>
      <option>Facts</option>
      <option>Story</option>
      <option>Funny</option>
      <option>News</option>
    </select>

    <label>🌍 Language</label>

    <select id="language">
      <option>English</option>
      <option>Hindi</option>
      <option>Telugu</option>
    </select>

    <label>⏱️ Video Duration</label>

    <select id="duration">
      <option>30 seconds</option>
      <option>60 seconds</option>
      <option>90 seconds</option>
    </select>

    <button onclick="createVideo()">
  🚀 Create Video Plan
</button>

<button onclick="downloadScript()">
  ⬇️ Download Video Script
</button>
<button onclick="generateVideo()">
  🎬 Generate Video
</button>
    <div id="videoStatus"></div>
    <div id="result" class="result">

      <div class="box">
        <h3>📝 Video Script</h3>
        <p id="script"></p>
      </div>

      <div class="box">
        <h3>🎙️ Voice-over</h3>
        <p id="voice"></p>
      </div>

      <div class="box">
        <h3>🎬 Scene Plan</h3>
        <p id="scenes"></p>
      </div>

      <div class="box">
        <h3>🖼️ Visual Prompt</h3>
        <p id="visual"></p>
      </div>

    </div>

  </div>

</div>

<footer>
  © 2026 VideoAI • Free AI Content Creator
</footer>

<script>
async function createVideo() {
  const topic = document.getElementById("topic").value.trim();
  const style = document.getElementById("style").value;
  const language = document.getElementById("language").value;
  const duration = document.getElementById("duration").value;

  if (topic === "") {
    alert("Please enter a video topic.");
    return;
  }

  document.getElementById("result").style.display = "block";
  document.getElementById("script").innerHTML = "⏳ Creating your AI video plan...";
  document.getElementById("voice").innerHTML = "Please wait...";
  document.getElementById("scenes").innerHTML = "Please wait...";
  document.getElementById("visual").innerHTML = "Please wait...";

  try {
    const response = await fetch(
      "https://dawn-snow-c3bb.boddepallithanuja12.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          topic: topic,
          style: style,
          language: language,
          duration: duration
        })
      }
    );

    const data = await response.json();

    if (data.error) {
      throw new Error(data.error);
    }

    document.getElementById("script").innerHTML =
      data.script || "No script generated.";

    document.getElementById("voice").innerHTML =
      "<b>Voice language: " + language + "</b><br><br>" +
      (data.voiceover || "No voice-over generated.");

    const scenes = data.scenes || [];

    document.getElementById("scenes").innerHTML =
      scenes.map(function(scene, index) {
        return "<b>Scene " + (index + 1) + ":</b> " + scene + "<br><br>";
      }).join("");

    document.getElementById("visual").innerHTML =
      data.visualPrompt || "No visual prompt generated.";

  } catch (error) {
    document.getElementById("script").innerHTML =
      "❌ Something went wrong: " + error.message;

    document.getElementById("voice").innerHTML = "";
    document.getElementById("scenes").innerHTML = "";
    document.getElementById("visual").innerHTML = "";
  }
}

function downloadScript() {
  const script = document.getElementById("script").innerText;
  const voice = document.getElementById("voice").innerText;
  const scenes = document.getElementById("scenes").innerText;
  const visual = document.getElementById("visual").innerText;

  const content =
    "VIDEOAI VIDEO SCRIPT\n\n" +
    "VIDEO SCRIPT\n" + script + "\n\n" +
    "VOICE-OVER\n" + voice + "\n\n" +
    "SCENE PLAN\n" + scenes + "\n\n" +
    "VISUAL PROMPT\n" + visual;

  const blob = new Blob([content], { type: "text/plain" });
  const url = URL.createObjectURL(blob);

  const link = document.createElement("a");
  link.href = url;
  link.download = "VideoAI-Script.txt";
  link.click();

  URL.revokeObjectURL(url);
      }
  function generateVideo() {
  document.getElementById("videoStatus").innerHTML =
    "🎬 Preparing your video...";
  }
</script>

</body>
</html>
