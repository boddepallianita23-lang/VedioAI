```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoAI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #0f172a;
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 50px 20px 30px;
}

header h1 {
  font-size: 45px;
}

header p {
  color: #cbd5e1;
  margin-top: 10px;
  font-size: 18px;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1e293b;
  padding: 25px;
  border-radius: 18px;
}

label {
  display: block;
  margin: 18px 0 8px;
  font-weight: bold;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #475569;
  background: #0f172a;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 120px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 15px;
  border: none;
  border-radius: 10px;
  background: #7c3aed;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #6d28d9;
}

#result {
  display: none;
  margin-top: 25px;
  padding: 20px;
  background: #0f172a;
  border-radius: 12px;
  line-height: 1.7;
}

footer {
  text-align: center;
  padding: 30px;
  color: #94a3b8;
}
</style>
</head>

<body>

<header>
  <h1>🎬 VideoAI</h1>
  <p>Create AI video content easily</p>
</header>

<div class="container">
  <div class="card">

    <label>What video do you want to create?</label>

    <textarea id="topic"
      placeholder="Example: 5 amazing facts about space"></textarea>

    <label>Video Style</label>

    <select id="style">
      <option>Educational</option>
      <option>Motivational</option>
      <option>Story</option>
      <option>Facts</option>
      <option>Funny</option>
      <option>News</option>
    </select>

    <label>Language</label>

    <select id="language">
      <option>English</option>
      <option>Hindi</option>
      <option>Telugu</option>
    </select>

    <button onclick="generateVideo()">
      ✨ Generate AI Video Script
    </button>

    <div id="result"></div>

  </div>
</div>

<footer>
  © 2026 VideoAI
</footer>

<script>
function generateVideo() {

  const topic = document.getElementById("topic").value.trim();
  const style = document.getElementById("style").value;
  const language = document.getElementById("language").value;
  const result = document.getElementById("result");

  if (!topic) {
    alert("Please enter a video topic first.");
    return;
  }

  result.style.display = "block";

  result.innerHTML = `
    <h2>🎥 Your Video Plan</h2>
    <br>
    <p><strong>Topic:</strong> ${topic}</p>
    <p><strong>Style:</strong> ${style}</p>
    <p><strong>Language:</strong> ${language}</p>
    <br>
    <h3>📝 Sample Script</h3>
    <p>
      Welcome to VideoAI! Today we are going to explore
      <strong>${topic}</strong>.
      Stay until the end to discover something amazing!
    </p>
    <br>
    <p>🎙️ Voice-over: Ready</p>
    <p>🖼️ Visual prompts: Ready</p>
    <p>📱 Short-video format: Ready</p>
  `;
}
</script>

</body>
</html>
```
