```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VideoAI - AI Content Creator</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #0f172a, #312e81);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 45px 20px 25px;
}

header h1 {
  font-size: 48px;
  margin: 0;
}

header p {
  color: #cbd5e1;
  font-size: 18px;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

.card {
  background: rgba(30, 41, 59, 0.95);
  padding: 30px;
  border-radius: 20px;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
  font-weight: bold;
}

textarea,
select {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #64748b;
  background: #0f172a;
  color: white;
  font-size: 16px;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: #8b5cf6;
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #7c3aed;
}

.result {
  display: none;
  margin-top: 30px;
}

.box {
  background: #0f172a;
  padding: 20px;
  border-radius: 14px;
  margin-top: 15px;
  line-height: 1.7;
}

.box h3 {
  margin-top: 0;
}

footer {
  text-align: center;
  padding: 30px;
  color: #94a3b8;
}
</style>
</head>

<body>

<header>
  <h1>🎬 VideoAI</h1>
  <p>Turn your idea into an AI-ready video plan</p>
</header>

<div class="container">

  <div class="card">

    <label>💡 Video Topic</label>

    <textarea id="topic"
      placeholder="Example: 5 amazing facts about the universe"></textarea>

    <label>🎨 Video Style</label>

    <select id="style">
      <option>Educational</option>
      <option>Motivational</option>
      <option>Facts</option>
      <option>Story</option>
      <option>Funny</option>
      <option>News</option>
    </select>

    <label>🌍 Language</label>

    <select id="language">
      <option>English</option>
      <option>Hindi</option>
      <option>Telugu</option>
    </select>

    <label>⏱️ Video Duration</label>

    <select id="duration">
      <option>30 seconds</option>
      <option>60 seconds</option>
      <option>90 seconds</option>
    </select>

    <button onclick="createVideo()">
      🚀 Create Video Plan
    </button>

    <div id="result" class="result">

      <div class="box">
        <h3>📝 Video Script</h3>
        <p id="script"></p>
      </div>

      <div class="box">
        <h3>🎙️ Voice-over</h3>
        <p id="voice"></p>
      </div>

      <div class="box">
        <h3>🎬 Scene Plan</h3>
        <p id="scenes"></p>
      </div>

      <div class="box">
        <h3>🖼️ Visual Prompt</h3>
        <p id="visual"></p>
      </div>

    </div>

  </div>

</div>

<footer>
  © 2026 VideoAI • Free AI Content Creator
</footer>

<script>

function createVideo() {

  const topic = document.getElementById("topic").value.trim();
  const style = document.getElementById("style").value;
  const language = document.getElementById("language").value;
  const duration = document.getElementById("duration").value;

  if (topic === "") {
    alert("Please enter a video topic.");
    return;
  }

  document.getElementById("result").style.display = "block";

  document.getElementById("script").innerHTML =
    "Today we are exploring <b>" + topic +
    "</b>. This " + duration +
    " " + style +
    " video is designed for social media. " +
    "Watch until the end to discover the most interesting facts and ideas about this topic!";

  document.getElementById("voice").innerHTML =
    "Voice language: <b>" + language +
    "</b><br><br>" +
    "Hello everyone! Today we're going to talk about " +
    "<b>" + topic +
    "</b>. Let's discover something amazing together!";

  document.getElementById("scenes").innerHTML =
    "<b>Scene 1:</b> Show an exciting introduction to " + topic + ".<br><br>" +
    "<b>Scene 2:</b> Show the main information or story.<br><br>" +
    "<b>Scene 3:</b> Show interesting details and examples.<br><br>" +
    "<b>Scene 4:</b> Finish with a strong conclusion and call to action.";

  document.getElementById("visual").innerHTML =
    "Create a high-quality cinematic vertical video about <b>" +
    topic +
    "</b>, suitable for YouTube Shorts, Instagram Reels and TikTok. " +
    "Modern visuals, dramatic lighting, engaging composition, 9:16 format.";

}

</script>

</body>
</html>
```
